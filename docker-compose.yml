version: '3.8'

services:
  # ==========================================
  # DVWA - Damn Vulnerable Web Application
  # ==========================================
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: soc-dvwa
    ports:
      - "${DVWA_PORT:-8080}:80"
    environment:
      - DVWA_DB_DRIVER=${DVWA_DB_DRIVER:-mysqli}
      - DVWA_DB_USER=${DVWA_DB_USER:-root}
      - DVWA_DB_PASSWORD=${DVWA_DB_PASSWORD:-password}
      - DVWA_DB_HOST=${DVWA_DB_HOST:-localhost}
    networks:
      - soc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login.php"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # Nginx - Reverse Proxy & Log Collection
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: soc-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      dvwa:
        condition: service_healthy
    networks:
      - soc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # Wazuh Manager - Analysis & Rules Engine
  # ==========================================
  wazuh-manager:
    image: wazuh/wazuh:${WAZUH_VERSION:-4.7.0}
    container_name: wazuh-manager
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecurePassword123!
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/certs/ca.crt
      - SSL_CERTIFICATE=/etc/ssl/certs/wazuh.crt
      - SSL_KEY=/etc/ssl/private/wazuh.key
      - TZ=${TZ:-UTC}
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "9300:9300"
    volumes:
      - wazuh-api-logs:/var/ossec/logs
      - wazuh-etc:/var/ossec/etc
      - wazuh-queue:/var/ossec/queue
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-ruleset:/var/ossec/ruleset
      - ./wazuh/rules/custom_rules.xml:/var/ossec/etc/rules/custom_rules.xml:ro
      - wazuh-backup:/var/ossec/backup
    networks:
      - soc-network
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:55000/version"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ==========================================
  # Wazuh Indexer - Log Storage & Indexing
  # ==========================================
  wazuh-indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.7.0}
    container_name: wazuh-indexer
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - INDEXER_SECURITY_SSL_HTTP_ENABLED=true
      - INDEXER_SECURITY_SSL_HTTP_PEMCERT_FILE=/etc/ssl/certs/wazuh.crt
      - INDEXER_SECURITY_SSL_HTTP_PEMKEY_FILE=/etc/ssl/private/wazuh.key
      - INDEXER_SECURITY_SSL_HTTP_PEMKEY_PASSWORD=SecurePassword123!
      - INDEXER_NAME=node-1
      - CLUSTER_NAME=wazuh-cluster
      - DISCOVERY_TYPE=single-node
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/opensearch
    networks:
      - soc-network
    restart: unless-stopped
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:SecurePassword123!", "-k", "https://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ==========================================
  # Wazuh Dashboard - Visualization & Analysis
  # ==========================================
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.7.0}
    container_name: wazuh-dashboard
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecurePassword123!
      - WAZUH_API_URL=https://wazuh-manager
      - WAZUH_API_PORT=55000
      - WAZUH_API_USERNAME=wazuh
      - WAZUH_API_PASSWORD=wazuh
    ports:
      - "${WAZUH_DASHBOARD_PORT:-5601}:5601"
    volumes:
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/config
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    networks:
      - soc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ==========================================
  # Filebeat - Log Forwarder to Wazuh
  # ==========================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:${FILEBEAT_VERSION:-8.11.0}
    container_name: soc-filebeat
    user: root
    environment:
      - WAZUH_MANAGER=wazuh-manager
      - WAZUH_MANAGER_PORT=1514
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nginx-logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx
      - wazuh-manager
    networks:
      - soc-network
    restart: unless-stopped
    command: filebeat -e -strict.perms=false

# ==========================================
# Networks
# ==========================================
networks:
  soc-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  nginx-logs:
    driver: local
  wazuh-api-logs:
    driver: local
  wazuh-etc:
    driver: local
  wazuh-queue:
    driver: local
  wazuh-integrations:
    driver: local
  wazuh-active-response:
    driver: local
  wazuh-ruleset:
    driver: local
  wazuh-backup:
    driver: local
  wazuh-indexer-data:
    driver: local
  wazuh-dashboard-config:
    driver: local