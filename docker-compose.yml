services:
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: soc-dvwa
    ports:
      - "${DVWA_PORT:-8080}:80"
    environment:
      - DVWA_DB_DRIVER=${DVWA_DB_DRIVER:-mysqli}
      - DVWA_DB_USER=${DVWA_DB_USER:-root}
      - DVWA_DB_PASSWORD=${DVWA_DB_PASSWORD:-password}
      - DVWA_DB_HOST=${DVWA_DB_HOST:-localhost}
    networks:
      - soc-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: soc-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - nginx-logs:/var/log/nginx
    depends_on:
      dvwa:
        condition: service_started
    networks:
      - soc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: wazuh-manager
    environment:
      - INDEXER_URL=http://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecurePassword123!
      - TZ=${TZ:-UTC}
      - WAZUH_API_HTTPS_ENABLED=false
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "9300:9300"
      - "55000:55000"
    volumes:
      - wazuh-api-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-ruleset:/var/ossec/ruleset
      # - ./wazuh/rules/custom_rules.xml:/var/ossec/etc/rules/custom_rules.xml:ro
      - wazuh-backup:/var/ossec/backup
    networks:
      - soc-network
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "wazuh:wazuh", "http://localhost:55000/version"]
      interval: 30s
      timeout: 10s
      retries: 3

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.0
    container_name: wazuh-indexer
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - INDEXER_SECURITY_SSL_HTTP_ENABLED=false
      - INDEXER_NAME=node-1
      - CLUSTER_NAME=wazuh-cluster
      - DISCOVERY_TYPE=single-node
    ports:
      - "9200:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/opensearch
    networks:
      - soc-network
    restart: unless-stopped
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:SecurePassword123!", "http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 3

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.0
    container_name: wazuh-dashboard
    environment:
      - OPENSEARCH_HOSTS=http://wazuh-indexer:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=SecurePassword123!
      - WAZUH_API_URL=http://wazuh-manager:55000
      - WAZUH_API_USERNAME=wazuh
      - WAZUH_API_PASSWORD=wazuh
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=SecurePassword123!
    ports:
      - "${WAZUH_DASHBOARD_PORT:-5601}:5601"
    volumes:
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/config
    depends_on:
      wazuh-indexer:
        condition: service_started
      wazuh-manager:
        condition: service_started
    networks:
      - soc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:SecurePassword123!", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 10s
      retries: 3

  filebeat:
    image: docker.elastic.co/beats/filebeat:${FILEBEAT_VERSION:-8.11.0}
    container_name: soc-filebeat
    user: root
    environment:
      - WAZUH_MANAGER=wazuh-manager
      - WAZUH_MANAGER_PORT=1514
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nginx-logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx
      - wazuh-manager
    networks:
      - soc-network
    restart: unless-stopped
    command: filebeat -e -strict.perms=false

networks:
  soc-network:
    driver: bridge

volumes:
  nginx-logs:
  wazuh-api-logs:
  wazuh-etc:
  wazuh-queue:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-ruleset:
  wazuh-backup:
  wazuh-indexer-data:
  wazuh-dashboard-config:
