# ==========================================
# Nginx Reverse Proxy Configuration for DVWA
# ==========================================

upstream dvwa_backend {
    server dvwa:80;
    keepalive 32;
}

# Main proxy configuration
server {
    listen 80;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    # Log all requests with detailed information
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log warn;
    
    # Proxy to DVWA
    location / {
        proxy_pass http://dvwa_backend;
        proxy_http_version 1.1;
        
        # Enable request body logging for better detection
        proxy_request_buffering on;
    }
    
    # Block potentially dangerous locations
    location ~ /\.ht {
        deny all;
        access_log off;
        log_not_found off;
    }
}
